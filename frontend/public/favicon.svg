<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00236f" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#primary-grad)" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none" />

  <!-- Justice scale beam / pillar -->
  <path d="M32 14V46" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <path d="M22 46H42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="14" r="3" fill="#38bdf8" />

  <!-- Balance crossbar -->
  <path d="M16 22L32 18L48 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Left scale plate (Calculation / Division icon: % / division) -->
  <path d="M16 22V28" stroke="#ffffff" stroke-width="1.5" />
  <path d="M10 28C10 32 22 32 22 28H10Z" fill="#38bdf8" fill-opacity="0.9" />
  
  <!-- Right scale plate (Assets / Coins) -->
  <path d="M48 22V28" stroke="#ffffff" stroke-width="1.5" />
  <path d="M42 28C42 32 54 32 54 28H42Z" fill="#38bdf8" fill-opacity="0.9" />

  <!-- Subtle percentage / calculation dot accents -->
  <circle cx="21" cy="38" r="2" fill="#38bdf8" />
  <circle cx="43" cy="38" r="2" fill="#38bdf8" />
  <path d="M25 41L39 35" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2" />
</svg>